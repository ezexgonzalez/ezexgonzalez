<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 316" width="1000" height="316" role="img" aria-label="Ezequiel Gonzalez. Full Stack Developer y Creative Development. Banner ASCII monocromatico con animacion discreta.">
<defs><clipPath id="screen"><rect x="571" y="47" width="389" height="225" rx="4"/></clipPath><linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b0f13"/><stop offset="1" stop-color="#11161c"/></linearGradient></defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.ascii-line{animation:emerge .6s ease both}
.cursor{animation:blink 1.1s steps(1,end) infinite}
.scan{animation:sweep 9s linear infinite}
@keyframes emerge{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes sweep{0%{transform:translateY(-10px);opacity:0}7%{opacity:.19}36%{opacity:.12}41%,100%{transform:translateY(225px);opacity:0}}
@media (prefers-reduced-motion:reduce){.ascii-line,.cursor,.scan{animation:none!important}}
</style>
