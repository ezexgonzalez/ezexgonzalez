<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 316" width="1000" height="316" role="img" aria-label="Ezequiel Gonzalez. Full Stack y Creative Development. Monograma E construido con caracteres ASCII y animación de señal.">
<defs>
<clipPath id="screen"><rect x="570" y="75" width="394" height="196" rx="2"/></clipPath>
<linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b0f13"/><stop offset="1" stop-color="#11161c"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d5dee7" stop-opacity="0"/><stop offset=".5" stop-color="#d5dee7" stop-opacity=".16"/><stop offset="1" stop-color="#d5dee7" stop-opacity="0"/></linearGradient>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.e-row{animation:assemble .8s ease-out both}
.e-mark{animation:breath 6s ease-in-out infinite}
.dust{animation:shimmer 5.5s ease-in-out infinite alternate}
.scan{animation:scan 8s linear infinite}
.cursor{animation:blink 1.1s steps(1,end) infinite}
@keyframes assemble{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes breath{0%,100%{opacity:.82}50%{opacity:1}}
@keyframes shimmer{0%,100%{opacity:.28}50%{opacity:.63}}
@keyframes scan{0%,8%{opacity:0;transform:translateY(-6px)}15%{opacity:1}42%{opacity:.5}52%,100%{opacity:0;transform:translateY(185px)}}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.e-row,.e-mark,.dust,.scan,.cursor{animation:none!important}.scan{opacity:0}}
</style>
